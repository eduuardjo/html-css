<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>

    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        caption {
            caption-side: top;
            font-weight: bold;
            margin-bottom: 10px;
        }

        col.cnome {
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>30</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>João Pedro</td>
            <td>M</td>
            <td>25</td>
            <td>Engenheiro</td>
        </tr>

        <tr>
            <td>Carla Souza</td>
            <td>F</td>
            <td>28</td>
            <td>Médica</td>
        </tr>

        <tr>
            <td>Lucas Lima</td>
            <td>M</td>
            <td>32</td>
            <td>Professor</td>
        </tr>

        <tr>
            <td>Mariana Alves</td>
            <td>F</td>
            <td>27</td>
            <td>Designer</td>
        </tr>

        <tr>
            <td>Rafael Costa</td>
            <td>M</td>
            <td>29</td>
            <td>Advogado</td>
        </tr>

    </table>
    
</body>
</html>
